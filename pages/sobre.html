<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../pages/sobre.css">
    <title>Tech Store</title>
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <!-- Logo -->
            <div class="logo">
                <a href="index.html" aria-label="Página inicial">
                    <img src="../assets/logo.png" alt="Logotipo da TechStore">
                </a>
            </div>

            <!-- Campo de busca -->
            <div class="search-section">
                <form class="search-form" role="search" aria-label="Buscar no site">
                    <input type="search" name="q" placeholder="Buscar..." aria-label="Campo de busca">
                    <button type="submit" aria-label="Buscar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <!-- Links secundários -->
                <nav class="secondary-nav" aria-label="Links rápidos">
                    <ul>
                        <li><a href="#">Início</a></li>
                        <li><a href="#">Produtos</a></li>
                        <li><a href="#">Contato</a></li>
                    </ul>
                </nav>
            </div>

            <!-- Ícones -->
            <nav class="icon-nav" aria-label="Acesso rápido">
                <ul>
                    <li><a href="#" aria-label="Perfil"><i class="fa-solid fa-user"></i></a></li>
                    <li><a href="#" aria-label="Favoritos"><i class="fa-solid fa-heart"></i></a></li>
                    <li><a href="#" aria-label="Carrinho"><i class="fa-solid fa-cart-shopping"></i></a></li>
                </ul>
            </nav>
        </div>
    </header>
</body>

</html>
