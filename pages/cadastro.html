<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./cadastro.css" />
    <title>Tech Store</title>
</head>

<body>
    <main>
        <section class="logo">
            <figure>
                <img src="../assets/logo.png" alt="Logotipo da Tech Store" /">
            </figure>
        </section>

        <section class="container">
            <section class="form">
                <h1>Cadastro</h1>

                <form action="" method="post">
                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="usuario_email" placeholder="ex: techstore@gmail.com"
                            autocomplete="email" required />
                    </div>

                    <div class="campo">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="usuario_senha" placeholder="ex: ***************"
                            autocomplete="new-password" required />
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="usuario_telefone" placeholder="ex: 19 99999-9999"
                            autocomplete="tel" />
                    </div>

                    <a href="login.html" rel="noopener noreferrer">
                        <button class="btn" type="button">Finalizar</button>
                    </a>
                </form>
            </section>
        </section>
    </main>

    <footer>
        <p>© 2025 Tech Store. Todos os direitos reservados. Proibida a reprodução total ou parcial sem autorização.</p>
        <nav>
            <a href="sobre.html">Sobre TechStore</a>
            <a href="contato.html">Entre em Contato</a>
            <a href="ajuda.html">Ajuda</a>
        </nav>
    </footer>
</body>

</html>
