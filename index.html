<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <title>Tech Store</title>
</head>

<body>
    <section>
        <figure>
            <img src="" alt="" />
        </figure>
    </section>

    <section>
        <form action="" method="post">
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="usuario_email" placeholder="ex: techstore@gmail.com" />
            </div>
            <div>
                <label for="password">Senha:</label>
                <input type="password" id="password" name="usuario_senha" placeholder="ex: ***************" />
            </div>
            <div>
                <label for="telephone">Telefone:</label>
                <input type="telephone" id="telefone" name="usuario_telefone" placeholder="ex: 19 999999999">
            </div>

            <button type="submit">Finalizar</button>

        </form>
    </section>

</body>

</html>
