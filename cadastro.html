<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="cadastro.css">
    <title>Tech Store</title>
</head>

<body>
    <main>
        <section class="logo">
            <figure>
                <img src="" alt="Logo da TechStore" />
            </figure>
        </section>

        <section class="container">
            <section class="form">
                <h1>Cadastro</h1>

                <form action="" method="post">
                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="usuario_email" placeholder="ex: techstore@gmail.com" />
                    </div>
                    <div>
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="usuario_senha" placeholder="ex: ***************" />
                    </div>
                    <div>
                        <label for="telephone">Telefone:</label>
                        <input type="telephone" id="telefone" name="usuario_telefone" placeholder="ex: 19 999999999">
                    </div>

                    <button class="btn" type="submit">Finalizar</button>
                </form>
            </section>
        </section>

        <section class="direitos">
            <p>© 2025 Tech Store. Todos os direitos reservados.
                Proibida a reprodução total ou parcial sem autorização.
            </p>
        </section>

        <footer>
            <a href="">Sobre TechStore</a>
            <a href="">Entre em Contato</a>
            <a href="">Ajuda</a>
        </footer>

    </main>
</body>

</html>
